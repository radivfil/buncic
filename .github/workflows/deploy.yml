# Demo verzija na GitHub Pages: https://<korisnik>.github.io/<repo>/
# Uz demo oznake i noindex (Google ne indeksira primjere sadržaja).
name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        run: |
          BASE="/${{ github.event.repository.name }}"
          npx astro build --site "https://${{ github.repository_owner }}.github.io" --base "$BASE"
          node scripts/github-pages.mjs "$BASE"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
